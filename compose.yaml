name: postgresql-benchmark
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: benchmark_experiments
      POSTGRES_USER: benchmark
      POSTGRES_PASSWORD: ${BENCHMARK_DB_PASSWORD:-benchmark_local}
    ports:
      - "127.0.0.1:${BENCHMARK_DB_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benchmark -d benchmark_experiments"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
